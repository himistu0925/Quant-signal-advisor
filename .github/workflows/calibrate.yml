name: Recalibrate Thresholds

on:
  schedule:
    # plan.md section 16: recalibration cadence (quarterly vs monthly) is
    # still an open question -- monthly is a placeholder default. Adjust
    # this cron once that's decided, or just trigger manually until then.
    # :22 past the hour, not :00: avoids GitHub's documented top-of-hour
    # scheduling congestion (see schedule.yml for the same fix).
    - cron: '22 6 1 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -e .

      - name: Run calibration
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python scripts/calibrate.py

      - name: Commit updated calibration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add calibration/
          git diff --staged --quiet || git commit -m "Recalibrate thresholds [skip ci]"
          git push
