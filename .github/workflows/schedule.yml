name: Live Signal Check

on:
  schedule:
    # Generous UTC window covering US market hours across both EST (UTC-5)
    # and EDT (UTC-4) -- is_market_open() does the real America/New_York
    # check inside the script and exits quietly outside 9:30-16:00 ET
    # (plan.md section 3). 30-minute interval, not 15: GitHub silently
    # drops most fires of a */15 cron on low-traffic repos (observed
    # 2026-07-23 -- only 2 of ~40 expected fires actually ran), and
    # community reports say GitHub is measurably more reliable at 30min+.
    # Minutes offset to :07/:37, not :00/:30: GitHub's own docs warn that
    # "high load times include the start of every hour" and scheduled runs
    # are more likely to be delayed/dropped then -- confirmed again
    # 2026-07-24, where every fire that day landed exactly on :00/:30 and
    # zero of ~8 expected windows actually ran.
    - cron: '7,37 13-22 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

# Shared across every workflow that commits to config/, calibration/, data/,
# state/, or docs/ -- queues instead of racing on git push (a real
# possibility once add_ticker.yml/remove_ticker.yml can fire on demand
# during market hours, overlapping with this schedule).
concurrency:
  group: repo-state-write
  cancel-in-progress: false

jobs:
  check-signals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -e .

      - name: Run signal check
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python scripts/run_signal_check.py

      - name: Regenerate dashboard
        run: python scripts/generate_dashboard.py

      - name: Commit updated state and dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/ data/ docs/
          git diff --staged --quiet || git commit -m "Update signal state and dashboard [skip ci]"
          git push
