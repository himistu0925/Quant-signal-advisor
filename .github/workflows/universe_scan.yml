name: Scan Universe

on:
  schedule:
    # Nightly, well after US market close (16:00 ET) -- 06:00 UTC Tue-Sat
    # covers the Mon-Fri close. Not time-sensitive like schedule.yml's live
    # check, so no intraday re-validation is needed here.
    - cron: '0 6 * * 2-6'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -e .

      - name: Scan universe
        run: python scripts/scan_universe.py

      - name: Commit updated candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/universe_candidates.json
          git diff --staged --quiet || git commit -m "Update universe candidates [skip ci]"
          git push
