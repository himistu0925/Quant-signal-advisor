name: Scan Universe

on:
  schedule:
    # Shortly after the regular session closes (16:00 ET = 20:00 UTC EDT /
    # 21:00 UTC EST -- unlike schedule.yml's 13-22 UTC window, close always
    # falls on the *same* UTC calendar day as the ET trading date, so this
    # stays Mon-Fri, not Tue-Sat). 23:xx UTC gives a ~2-3h buffer past close
    # either way DST falls, and -- deliberately -- runs after schedule.yml's
    # last 22:37 UTC fire, so the two workflows' git-commit-and-push steps
    # never race each other over data/universe_candidates.json.
    # :13 past the hour, not :00: avoids GitHub's documented top-of-hour
    # scheduling congestion (see schedule.yml for the same fix, same root
    # cause observed 2026-07-24).
    - cron: '13 23 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -e .

      - name: Scan universe
        run: python scripts/scan_universe.py

      - name: Commit updated candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/universe_candidates.json
          git diff --staged --quiet || git commit -m "Update universe candidates [skip ci]"
          git push
